[package]
name = "appletui"
version = "0.2.0"
edition = "2021"
authors = ["Samyak"]
description = "Fast, lightweight Apple Music Terminal User Interface for Linux"
license = "MIT"
default-run = "appletui"

[lib]
name = "apple_tui"
path = "src/lib.rs"

[[bin]]
name = "appletui"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.43", features = ["full"] }
ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }
mpris-server = { version = "0.10", features = ["tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chromiumoxide = { version = "0.7", default-features = false, features = ["tokio-runtime"] }
clap = { version = "4.5", features = ["derive"] }
directories = "5.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
futures = "0.3"
thiserror = "2.0"
anyhow = "1.0"
unicode-width = "0.2"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
tempfile = "3.17"
tokio-test = "0.4"
